<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="Fil-He.css">
<script src="../../vendor/lucide.min.js"></script>
</head>
<body>
  <div class="app-filhe">
    
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn-toggle-sidebar" id="btn-toggle-sidebar" title="Mostrar/Ocultar bases de datos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <div class="topbar-title">
          <i data-lucide="hard-drive"></i>
          Fil-He
        </div>
      </div>
      <div class="topbar-right">
        <div class="storage-info" id="storage-info">Calculando...</div>
        <button class="btn-refresh" id="btn-refresh" title="Actualizar datos">
          <i data-lucide="refresh-cw"></i>
        </button>
      </div>
    </div>

    <!-- LAYOUT PRINCIPAL -->
    <div class="main-layout">
      <!-- SIDEBAR COLAPSABLE -->
      <div class="sidebar" id="sidebar">
        <div class="sidebar-inner">
          <div class="sidebar-header">
            Bases de Datos
          </div>
          <div class="db-list" id="db-list">
            <!-- Se llena por JS -->
          </div>
        </div>
      </div>

      <!-- ÁREA PRINCIPAL -->
      <div class="main-area">
        <div class="main-header" id="main-header">
          <span class="path"><i data-lucide="database"></i> Selecciona una tabla</span>
        </div>
        <div class="file-list-container" id="file-list">
          <div class="empty-state">
            <i data-lucide="folder-open"></i>
            <p>Selecciona una base de datos y una tabla para ver su contenido.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="Fil-He.js"></script>
</body>
</html>
