<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="forge.css">
<script src="../../vendor/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <div class="app-forge">
    <div class="forge-cab">
      <div class="forge-info">
        <i data-lucide="hammer"></i>
        <h2>Forge</h2>
      </div>
    </div>
    <div class="forge-content">
      <div class="drop-zone" id="drop-zone">
        <i data-lucide="upload-cloud"></i>
        <p>Arrastra un archivo .zip aquí</p>
        <span>o</span>
        <button class="btn" id="btn-file">Seleccionar archivo</button>
        <input type="file" id="file-input" accept=".zip" hidden>
      </div>
      <div class="installed-apps">
        <h3>Apps Instaladas</h3>
        <div id="apps-list"></div>
      </div>
    </div>
  </div>
  <script src="forge.js"></script>
</body>
</html>
