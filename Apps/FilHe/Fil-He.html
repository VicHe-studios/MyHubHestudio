<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="Fil-He.css">
<script src="../../vendor/lucide.min.js"></script>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <i data-lucide="hard-drive"></i>
      <span>Fil-He</span>
    </div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>

  <main class="main">
    <header class="toolbar">
      <nav class="breadcrumb" id="breadcrumb"></nav>
      <div class="toolbar-right">
        <div class="search-box">
          <i data-lucide="search"></i>
          <input type="text" id="search-input" placeholder="Buscar...">
        </div>
        <select id="sort-select" class="sort-select">
          <option value="name-asc">Nombre (A → Z)</option>
          <option value="name-desc">Nombre (Z → A)</option>
          <option value="type">Tipo</option>
        </select>
        <button class="btn btn-primary" id="btn-new-folder">
          <i data-lucide="folder-plus"></i>
          <span>Nueva carpeta</span>
        </button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<!-- Modal nueva carpeta -->
<div class="modal" id="modal-folder">
  <div class="modal-box">
    <h3>Nueva carpeta</h3>
    <input type="text" id="folder-name" placeholder="Nombre de la carpeta" maxlength="40" autocomplete="off">
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-primary" id="folder-create">Crear</button>
    </div>
  </div>
</div>

<!-- Modal confirmación -->
<div class="modal" id="modal-confirm">
  <div class="modal-box">
    <h3 id="confirm-title">¿Estás seguro?</h3>
    <p id="confirm-message"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>Cancelar</button>
      <button class="btn btn-danger" id="confirm-ok">Eliminar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="Fil-He.js"></script>
</body>
</html>
