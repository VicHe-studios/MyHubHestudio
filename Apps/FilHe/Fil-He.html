<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="Fil-He.css">
<script src="../../vendor/lucide.min.js"></script>
</head>
<body>

<div class="explorer">
  <!-- Topbar (Navegación) -->
  <div class="topbar">
    <div class="nav-controls">
      <button class="nav-btn" id="nav-back" disabled><i data-lucide="arrow-left"></i></button>
      <button class="nav-btn" id="nav-up"><i data-lucide="arrow-up"></i></button>
    </div>
    <div class="address-bar" id="breadcrumb"></div>
    <div class="search-bar">
      <i data-lucide="search"></i>
      <input type="text" id="search-input" placeholder="Buscar">
    </div>
  </div>

  <!-- Barra de Herramientas -->
  <div class="toolbar" id="toolbar">
    <button class="tool-btn primary" id="btn-new-folder"><i data-lucide="folder-plus"></i> Nueva carpeta</button>
    <div class="tool-sep"></div>
    <button class="tool-btn" id="btn-cut" disabled><i data-lucide="scissors"></i> Cortar</button>
    <button class="tool-btn" id="btn-copy" disabled><i data-lucide="copy"></i> Copiar</button>
    <button class="tool-btn" id="btn-paste" disabled><i data-lucide="clipboard"></i> Pegar</button>
    <button class="tool-btn" id="btn-delete" disabled><i data-lucide="trash-2"></i> Eliminar</button>
    <button class="tool-btn" id="btn-rename" disabled><i data-lucide="edit-2"></i> Renombrar</button>
    <div class="tool-sep"></div>
    <select id="sort-select" class="sort-select">
      <option value="name-asc">Nombre (A-Z)</option>
      <option value="name-desc">Nombre (Z-A)</option>
      <option value="type">Tipo</option>
    </select>
    <button class="tool-btn icon-only" id="btn-view-toggle" title="Cambiar vista"><i data-lucide="layout-grid"></i></button>
  </div>

  <div class="main-area">
    <!-- Panel Lateral -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- Área de Contenido -->
    <div class="content-wrapper">
      <div class="content" id="content"></div>
      <div class="statusbar" id="statusbar">
        <span id="status-text">0 elementos</span>
      </div>
    </div>
  </div>
</div>

<!-- Modales -->
<div class="modal" id="modal-folder">
  <div class="modal-box">
    <h3>Nueva carpeta</h3>
    <input type="text" id="folder-name" placeholder="Nombre de la carpeta" maxlength="40" autocomplete="off">
    <div class="modal-actions">
      <button class="btn" data-close>Cancelar</button>
      <button class="btn primary" id="folder-create">Crear</button>
    </div>
  </div>
</div>

<div class="modal" id="modal-confirm">
  <div class="modal-box">
    <h3 id="confirm-title">¿Estás seguro?</h3>
    <p id="confirm-message"></p>
    <div class="modal-actions">
      <button class="btn" data-close>Cancelar</button>
      <button class="btn danger" id="confirm-ok">Sí</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="Fil-He.js"></script>
</body>
</html>
