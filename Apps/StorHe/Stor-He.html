<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="Stor-He.css">
<script src="../../vendor/lucide.min.js"></script>
</head>
<body>
  <div class="app-storhe">
    <div class="storhe-cab">
      <div class="storhe-info">
        <i data-lucide="store"></i>
        <h2>Stor-He</h2>
      </div>
      <div class="storhe-tools">
        <input type="text" id="search-input" placeholder="Buscar app..." autocomplete="off">
        <button class="btn" id="btn-refresh" title="Actualizar tienda"><i data-lucide="refresh-cw"></i></button>
      </div>
    </div>
    <div class="storhe-content">
      <div id="apps-list" class="apps-list">
        <p style="text-align: center; color: var(--muted); margin-top: 20px;">Cargando tienda...</p>
      </div>
      <div id="pagination" class="pagination"></div>
    </div>
  </div>
  <script src="Stor-He.js"></script>
</body>
</html>
